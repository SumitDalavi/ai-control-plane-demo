name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: registry
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout demo repository
        uses: actions/checkout@v4
        with:
          path: ai-control-plane-demo

      - name: Checkout infra (dependency)
        uses: actions/checkout@v4
        with:
          repository: SumitDalavi/infra
          path: infra
        continue-on-error: true

      - name: Checkout nhi-agent-access-governance (dependency)
        uses: actions/checkout@v4
        with:
          repository: SumitDalavi/nhi-agent-access-governance
          path: nhi-agent-access-governance

      - name: Checkout llm-cost-autopilot (dependency)
        uses: actions/checkout@v4
        with:
          repository: SumitDalavi/llm-cost-autopilot
          path: llm-cost-autopilot

      - name: Checkout semantic-llm-cache (dependency)
        uses: actions/checkout@v4
        with:
          repository: SumitDalavi/semantic-llm-cache
          path: semantic-llm-cache

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up dependencies
        run: |
          mkdir -p infra/postgres/init
          touch infra/docker-compose.infra.yml
          # Normally we would fetch the true infra setup, but for CI we can rely on what was checked out

      - name: Run CI Pipeline
        working-directory: ai-control-plane-demo
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5433
          POSTGRES_DB: registry
          POSTGRES_PASSWORD: password
          PGPASSWORD: password
        run: |
          # Use local stubs for CI
          export DEMO_MODE=stub
          
          # Initialize database
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5433 -U postgres -d registry -f ../nhi-agent-access-governance/scripts/init.sql
          
          # Verify database tables
          psql -h 127.0.0.1 -p 5433 -U postgres -d registry -c "\dt"
          
          npm ci --prefix ../nhi-agent-access-governance/registry-api
          npm ci --prefix ../llm-cost-autopilot
          npm ci --prefix ../semantic-llm-cache
          make test
          # Due to potentially missing heavy deps, we'll only enforce unit tests here,
          # or try a mock infra-up if compose is configured for CI
          # make infra-up
          # make up
          # make wait
          # make demo
          # make verify
          # make down

  benchmark:
    name: Run Benchmark Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start services
        run: |
          docker network create portfolio_infra || true
          docker compose -f ../docker-compose.infra.yml up -d postgres redis || true
          docker compose up -d || true
          sleep 15
      - name: Run benchmark
        run: |
          mkdir -p benchmarks/results
          python benchmarks/benchmark.py || true
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmarks/
          retention-days: 90
      - name: Teardown
        if: always()
        run: docker compose down -v
